; CP01 - AICSS - ESP32CAM
; Projeto PlatformIO (VS Code) para a placa AI Thinker ESP32-CAM.
; O codigo-fonte fica em ../esp32cam_dataset (mesmo arquivo usado na Arduino IDE).

[platformio]
src_dir = ../esp32cam_dataset

[env:esp32cam]
platform  = espressif32@6.5.0
board     = esp32cam
framework = arduino

; --- gravacao pela USB (adaptador FTDI/CH340 ou placa ESP32-CAM-MB) ---
upload_speed  = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Se o VS Code nao achar a porta sozinho, descomente e ajuste:
; upload_port  = COM3          ; Windows
; upload_port  = /dev/ttyUSB0  ; Linux
; monitor_port = COM3

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; Placas com USB embutido. Use o env correspondente ao seu modulo e
; descomente o #define do mesmo modelo no inicio do .ino.
; ---------------------------------------------------------------------------
[env:freenove_wrover]      ; Freenove ESP32-WROVER CAM (USB-C na placa)
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino
upload_speed  = 921600
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1

[env:esp32s3cam]           ; Freenove ESP32-S3 WROOM CAM / ESP32-S3-EYE
platform  = espressif32@6.5.0
board     = esp32s3camlcd
framework = arduino
upload_speed  = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:xiao_esp32s3]         ; Seeed XIAO ESP32S3 Sense
platform  = espressif32@6.5.0
board     = seeed_xiao_esp32s3
framework = arduino
upload_speed  = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
