; CP01 - AICSS - ESP32CAM
; Projeto PlatformIO (VS Code) para a placa AI Thinker ESP32-CAM.
; O codigo-fonte fica em ../esp32cam_dataset (mesmo arquivo usado na Arduino IDE).

[platformio]
src_dir = ../esp32cam_dataset

[env:esp32cam]
platform  = espressif32@6.5.0
board     = esp32cam
framework = arduino

; --- gravacao pela USB (adaptador FTDI/CH340 ou placa ESP32-CAM-MB) ---
upload_speed  = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Se o VS Code nao achar a porta sozinho, descomente e ajuste:
; upload_port  = COM3          ; Windows
; upload_port  = /dev/ttyUSB0  ; Linux
; monitor_port = COM3

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
